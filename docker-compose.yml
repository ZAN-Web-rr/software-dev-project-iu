version: '3.8'

services:
  task-microservice:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-task-microservice:1.0.0
    container_name: smart_task_microservice_container
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - APP_VERSION=1.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

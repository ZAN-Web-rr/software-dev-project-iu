<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Task Management Dashboard - DLBSEPPSD01_E</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .hero-header { background: linear-gradient(135deg, #0d6efd, #0d47a1); color: white; padding: 2.5rem 0; margin-bottom: 2rem; border-radius: 0 0 1rem 1rem; }
    .card { border-radius: 0.75rem; border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); margin-bottom: 1.5rem; }
    .badge-status { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .task-item { transition: transform 0.2s; }
    .task-item:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="hero-header text-center">
    <div class="container">
      <h1 class="fw-bold">Smart Task & Project Management</h1>
      <p class="lead mb-0">DLBSEPPSD01_E Software Development Microservice Application</p>
      <div id="service-status" class="mt-2 text-warning fw-semibold">Checking Service Health...</div>
    </div>
  </header>

  <div class="container">
    <div class="row">
      
      <!-- Task Creation Form -->
      <div class="col-lg-4">
        <div class="card p-4">
          <h4 class="card-title mb-3 text-primary fw-bold">Create New Task</h4>
          <form id="create-task-form">
            <div class="mb-3">
              <label for="task-title" class="form-label font-monospace small">Task Title *</label>
              <input type="text" id="task-title" class="form-control" placeholder="e.g. Implement Dockerfile" required>
            </div>
            <div class="mb-3">
              <label for="task-desc" class="form-label font-monospace small">Description</label>
              <textarea id="task-desc" class="form-control" rows="3" placeholder="Task details and scope..."></textarea>
            </div>
            <div class="mb-3">
              <label for="task-priority" class="form-label font-monospace small">Priority</label>
              <select id="task-priority" class="form-select">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Add Task to Backlog</button>
          </form>
        </div>
      </div>

      <!-- Task Listing Dashboard -->
      <div class="col-lg-8">
        <div class="card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="card-title mb-0 text-dark fw-bold">Task Backlog</h4>
            <div class="d-flex gap-2">
              <select id="filter-status" class="form-select form-select-sm" onchange="fetchTasks()">
                <option value="">All Statuses</option>
                <option value="PENDING">Pending</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="COMPLETED">Completed</option>
              </select>
              <button class="btn btn-outline-secondary btn-sm" onclick="fetchTasks()">Refresh</button>
            </div>
          </div>

          <div id="tasks-container" class="row">
            <div class="text-center py-5 text-muted">Loading tasks from API...</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <footer class="text-center my-4 text-muted small">
    IU International University of Applied Sciences &copy; 2026 - Course DLBSEPPSD01_E
  </footer>

  <script>
    const API_BASE = '/api/v1/tasks';

    // Fetch Health Probe
    async function checkHealth() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        if (data.status === 'UP') {
          document.getElementById('service-status').className = 'mt-2 text-info small';
          document.getElementById('service-status').innerHTML = `✓ Microservice Health: UP (Uptime: ${Math.floor(data.uptime)}s)`;
        }
      } catch (err) {
        document.getElementById('service-status').className = 'mt-2 text-danger small';
        document.getElementById('service-status').innerHTML = '✗ Service Offline or Unreachable';
      }
    }

    // Fetch All Tasks
    async function fetchTasks() {
      const statusFilter = document.getElementById('filter-status').value;
      const url = statusFilter ? `${API_BASE}?status=${statusFilter}` : API_BASE;

      try {
        const res = await fetch(url);
        const result = await res.json();
        renderTasks(result.data || []);
      } catch (err) {
        document.getElementById('tasks-container').innerHTML = `<div class="alert alert-danger">Error loading tasks: ${err.message}</div>`;
      }
    }

    // Render Tasks UI
    function renderTasks(tasks) {
      const container = document.getElementById('tasks-container');
      if (tasks.length === 0) {
        container.innerHTML = `<div class="text-center py-4 text-muted">No tasks found in backlog.</div>`;
        return;
      }

      container.innerHTML = tasks.map(task => {
        let badgeColor = 'secondary';
        if (task.priority === 'HIGH') badgeColor = 'danger';
        if (task.priority === 'MEDIUM') badgeColor = 'warning text-dark';
        if (task.priority === 'LOW') badgeColor = 'info text-dark';

        let statusBadge = 'bg-secondary';
        if (task.status === 'COMPLETED') statusBadge = 'bg-success';
        if (task.status === 'IN_PROGRESS') statusBadge = 'bg-primary';

        return `
          <div class="col-12 mb-3">
            <div class="card task-item border-start border-4 ${task.status === 'COMPLETED' ? 'border-success' : 'border-primary'} p-3">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h5 class="fw-bold mb-1 ${task.status === 'COMPLETED' ? 'text-decoration-line-through text-muted' : ''}">${escapeHtml(task.title)}</h5>
                  <p class="text-muted small mb-2">${escapeHtml(task.description || 'No details provided.')}</p>
                  <div>
                    <span class="badge bg-${badgeColor} badge-status">${task.priority}</span>
                    <span class="badge ${statusBadge} badge-status ms-1">${task.status}</span>
                    <span class="text-muted extra-small ms-2" style="font-size: 0.75rem;">Created: ${new Date(task.createdAt).toLocaleDateString()}</span>
                  </div>
                </div>
                <div class="d-flex gap-1">
                  ${task.status !== 'COMPLETED' ? `<button class="btn btn-sm btn-outline-success" onclick="updateTaskStatus(${task.id}, 'COMPLETED')">✓ Done</button>` : ''}
                  <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${task.id})">Delete</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Handle Form Submit (Create Task)
    document.getElementById('create-task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('task-title').value;
      const description = document.getElementById('task-desc').value;
      const priority = document.getElementById('task-priority').value;

      try {
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, priority })
        });

        if (res.ok) {
          document.getElementById('create-task-form').reset();
          fetchTasks();
        } else {
          const errData = await res.json();
          alert(`Error: ${errData.error}`);
        }
      } catch (err) {
        alert(`Failed to create task: ${err.message}`);
      }
    });

    // Update Task Status
    async function updateTaskStatus(id, newStatus) {
      try {
        const res = await fetch(`${API_BASE}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (res.ok) fetchTasks();
      } catch (err) {
        alert(`Error updating task: ${err.message}`);
      }
    }

    // Delete Task
    async function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      try {
        const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
        if (res.ok) fetchTasks();
      } catch (err) {
        alert(`Error deleting task: ${err.message}`);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
    }

    // Initial load
    checkHealth();
    fetchTasks();
  </script>
</body>
</html>
